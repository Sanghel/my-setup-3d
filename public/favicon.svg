<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Mini diorama del cuarto (ajustes visuales 2): dos paredes, piso de madera, la pantalla de colores y el LED rojo -->
  <rect width="64" height="64" rx="14" fill="#1b1612"/>
  <!-- Paredes: izquierda (fondo) y derecha (ventana) -->
  <path d="M10 24 L32 12 L32 38 L10 50 Z" fill="#efe3d3"/>
  <path d="M32 12 L54 24 L54 50 L32 38 Z" fill="#d9cbb8"/>
  <!-- Piso de madera -->
  <path d="M10 50 L32 38 L54 50 L32 62 Z" fill="#9a6440"/>
  <path d="M21 44 L43 56 M27 41 L49 53" stroke="#7e4f31" stroke-width="1"/>
  <!-- Escritorio y pantalla -->
  <path d="M14 45 L28 37 L34 40.5 L20 48.5 Z" fill="#26211d"/>
  <!-- Pantalla: tres franjas de las ondas del fondo (colores sólidos: se ven igual en SVG y en PNG) -->
  <path d="M16 36 L28 29.2 L28 31.8 L16 38.6 Z" fill="#6f7df2"/>
  <path d="M16 38.6 L28 31.8 L28 34.2 L16 41 Z" fill="#3fd0f4"/>
  <path d="M16 41 L28 34.2 L28 36.6 L16 43.4 Z" fill="#f7a6c4"/>
  <!-- LED rojo bajo el escritorio -->
  <path d="M15 47.6 L27 40.8" stroke="#ff4a5a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Camiseta en la pared de la ventana -->
  <path d="M40 22.5 L47 26.5 L47 34.5 L40 30.5 Z" fill="#c8102e"/>
</svg>
