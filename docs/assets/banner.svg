<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="My Setup 3D — my room and desk setup as an interactive 3D diorama">
  <defs>
    <radialGradient id="sunset" cx="82%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#F7A65A" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F7A65A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="led" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4A5A" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FF4A5A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A86E47"/>
      <stop offset="100%" stop-color="#8A5636"/>
    </linearGradient>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .breathe { animation: breathe 3.6s ease-in-out infinite; }
      @keyframes breathe { 50% { opacity: .35 } }
      @media (prefers-reduced-motion: reduce) { .breathe { animation: none } }
    </style>
  </defs>

  <rect width="1280" height="360" rx="20" fill="#1B1612"/>
  <rect width="1280" height="360" rx="20" fill="url(#sunset)"/>

  <!-- The room, scaled up from the favicon's mini diorama (64-unit grid) -->
  <g transform="translate(822 6) scale(5.4)">
    <path d="M10 24 L32 12 L32 38 L10 50 Z" fill="#EFE3D3"/>
    <path d="M32 12 L54 24 L54 50 L32 38 Z" fill="#D9CBB8"/>
    <!-- Window with sunset on the right wall -->
    <path d="M44 25 L51 29 L51 37 L44 33 Z" fill="#F7A65A"/>
    <path d="M44 25 L51 29 L51 32 L44 28 Z" fill="#F7C98A"/>
    <path d="M10 50 L32 38 L54 50 L32 62 Z" fill="url(#floor)"/>
    <path d="M21 44 L43 56 M27 41 L49 53 M15 47 L37 59" stroke="#7E4F31" stroke-width="0.4"/>
    <!-- Desk, monitor and LED strip -->
    <ellipse class="breathe" cx="21" cy="45" rx="10" ry="4" fill="url(#led)"/>
    <path d="M14 45 L28 37 L34 40.5 L20 48.5 Z" fill="#26211D"/>
    <path d="M16 36 L28 29.2 L28 31.8 L16 38.6 Z" fill="#6F7DF2"/>
    <path d="M16 38.6 L28 31.8 L28 34.2 L16 41 Z" fill="#3FD0F4"/>
    <path d="M16 41 L28 34.2 L28 36.6 L16 43.4 Z" fill="#F7A6C4"/>
    <path class="breathe" d="M15 47.6 L27 40.8" stroke="#FF4A5A" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Framed shirt and poster -->
    <path d="M38 19 L44 22.5 L44 30 L38 26.5 Z" fill="#C8102E"/>
    <path d="M18 22 L26 17.5 L26 24 L18 28.5 Z" fill="#3B3F4A"/>
    <path d="M19 22.6 L25 19.2 L25 23.4 L19 26.8 Z" fill="#7A8296"/>
  </g>

  <g class="t">
    <text x="96" y="122" class="m" fill="#FF6B78" font-size="15" font-weight="600" letter-spacing="4">INTERACTIVE 3D DIORAMA</text>
    <text x="93" y="192" fill="#F6EEE4" font-size="68" font-weight="800" letter-spacing="-1.5">My Setup 3D</text>
    <rect x="96" y="210" width="56" height="4" rx="2" fill="#FF4A5A"/>
    <text x="96" y="248" fill="#F6EEE4" fill-opacity="0.7" font-size="23">My room and desk, built in Blender from real measurements.</text>
    <g font-size="14" font-weight="600">
      <rect x="96" y="270" width="108" height="30" rx="15" fill="#F7A65A" fill-opacity="0.12" stroke="#F7A65A" stroke-opacity="0.55"/>
      <text x="150" y="290" text-anchor="middle" fill="#FBD3A8">Afternoon</text>
      <rect x="214" y="270" width="76" height="30" rx="15" fill="#6F7DF2" fill-opacity="0.14" stroke="#6F7DF2" stroke-opacity="0.6"/>
      <text x="252" y="290" text-anchor="middle" fill="#C9CEFF">Night</text>
      <rect x="300" y="270" width="104" height="30" rx="15" fill="#FF4A5A" fill-opacity="0.12" stroke="#FF4A5A" stroke-opacity="0.55"/>
      <text x="352" y="290" text-anchor="middle" fill="#FFC2C8">11 objects</text>
      <rect x="414" y="270" width="138" height="30" rx="15" fill="#EFE3D3" fill-opacity="0.06" stroke="#EFE3D3" stroke-opacity="0.35"/>
      <text x="483" y="290" text-anchor="middle" fill="#EFE3D3">Baked lighting</text>
    </g>
  </g>
</svg>
